version: '3.9'

services:
  db:
    image: postgres
    environment:
      POSTGRES_DB: whale_scale
      POSTGRES_USER: whale_admin
      POSTGRES_PASSWORD: js2zyBull88
  backend:
    build:
      context: ./whale_scale
      dockerfile: Dockerfile.dev
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file: .env
    expose:
      - "8000"

  frontend:
    build:
      context: ./whale_scale/frontend
      dockerfile: Dockerfile.dev
      args:
        - REACT_APP_API_URL=https://dev-whale-scale.colab.duke.edu
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  static_volume:
  media_volume:
