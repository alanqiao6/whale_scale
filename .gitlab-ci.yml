image: docker:24.0.5

services:
  - docker:dind

stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""

before_script:
  - apk add --no-cache openssh-client

build:
  stage: build
  script:
    - |
      # Map branch to ENVIRONMENT
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        export ENVIRONMENT=prod
      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        export ENVIRONMENT=dev
      else
        echo "Unknown branch: $CI_COMMIT_REF_NAME. Skipping build."
        exit 0
      fi

      echo "Building for ENVIRONMENT=$ENVIRONMENT"

      # Run the appropriate build
      docker compose -f docker-compose.$ENVIRONMENT.yml build

deploy-prod:
  stage: deploy
  only:
    refs:
      - main
  script:
    - echo "$SSH_PRIVATE_KEY_PROD" > id_rsa
    - chmod 600 id_rsa
    - ssh -o StrictHostKeyChecking=no -i id_rsa $VCM_USER_PROD@$VCM_IP_PROD << 'EOF'
        cd /home/vcm/APP_WHALESCALE
        git checkout main
        git pull origin main
        docker compose -f docker-compose.prod.yml down
        docker compose -f docker-compose.prod.yml up -d --build
      EOF

deploy-dev:
  stage: deploy
  only:
    refs:
      - dev
  script:
    - echo "$SSH_PRIVATE_KEY_DEV" > id_rsa
    - chmod 600 id_rsa
    - ssh -o StrictHostKeyChecking=no -i id_rsa $VCM_USER_DEV@$VCM_IP_DEV << 'EOF'
        cd /home/vcm/APP_WHALESCALE
        git checkout dev
        git pull origin dev
        docker compose -f docker-compose.dev.yml down
        docker compose -f docker-compose.dev.yml up -d --build
      EOF
